name: Test Action Fail
on:
  workflow_dispatch:
    inputs:
      message:
        description: '테스트 메시지'
        required: false
        default: 'hello'
      category:
        description: '카테고리'
        required: false
        default: 'default-category'
      customValue:
        description: '고정값 테스트'
        required: false
        default: 'fixed'
      force_fail:
        description: '실패시키기 위함'
        required: true
        default: 'fixed2'

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Echo message
        run: |
          echo "입력받은 메시지: ${{ github.event.inputs.message }} / ${{ github.event.inputs.category }} / ${{ github.event.inputs.customValue }}
          ${{ github.event.inputs.force_fail }}"
      - name: Wait 60 seconds                                                                                                                                                                                  
        run: sleep 60
