name: Test Action
   on:
     workflow_dispatch:
       inputs:
         message:
           description: '테스트 메시지'
           required: false
           default: 'hello'

   jobs:
     test-job:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout
           uses: actions/checkout@v4
         - name: Echo message
           run: echo "입력받은 메시지: ${{ github.event.inputs.message }}"
